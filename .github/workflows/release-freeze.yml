name: Release / Freeze gate
on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev]
permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read
concurrency:
  group: instance-mutate-dev
  cancel-in-progress: false
  queue: max
jobs:
  # The ruleset requires the context `release-freeze` from GitHub Actions. Only a job
  # check run satisfies it, so the job name IS the check and its exit code the verdict.
  release-freeze:
    name: release-freeze
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # Never checkout or execute the PR/merge-group code with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "'check-pr'" scripts/release/cycle_control.py; then
            echo "::error::Trusted main controller has no check-pr entry point yet; promote the release-freeze fix to main first."
            exit 1
          fi
          python3 scripts/release/cycle_control.py check-pr
  refresh:
    name: release-freeze refresh
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/cycle_control.py checks
