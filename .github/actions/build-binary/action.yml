name: build-binary
description: Build frontend + Go static binary, upload as yourtj-hub artifact

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 11
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: "1.26"
        cache-dependency-path: apps/gooseforum/go.sum
    - name: Build frontend
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum/resource
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - name: Build binary (static, no cgo for alpine/musl)
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum
      run: |
        source_sha=$(git rev-parse HEAD)
        CGO_ENABLED=0 go build -ldflags "-X github.com/YourTongji/YourTJ-Hub/apps/gooseforum/app/bundles/buildinfo.Version=dev -X github.com/YourTongji/YourTJ-Hub/apps/gooseforum/app/bundles/buildinfo.Commit=$source_sha" -o ../../bin/yourtj-hub .
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: yourtj-hub
        path: bin/yourtj-hub
        retention-days: 3
